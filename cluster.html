<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>省级经济因素聚类 · 着色地图</title>
<style>
  :root {
    --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#8b9bb4;
    --c1:#2aa198; --c2:#cb4b16; --line:#2a3548;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#1c2a3f 0%,var(--bg) 55%);color:var(--text);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 64px}
  h1{margin:0 0 8px;font-size:1.55rem;font-weight:650}
  .sub{color:var(--muted);line-height:1.65;font-size:.95rem;margin:0}
  .badge{display:inline-block;margin-top:14px;padding:4px 10px;border-radius:999px;background:#243247;color:#9ec5e8;font-size:.8rem}

  .nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
  .nav a{text-decoration:none;color:#8b9bb4;background:#243247;padding:7px 12px;border-radius:999px;font-size:.85rem;border:1px solid #2a3548}
  .nav a.active,.nav a:hover{color:#e7ecf3;border-color:#5b9fd4;color:#9ec5e8}

  .legend{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 8px}
  .legend span{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem}
  .swatch{width:14px;height:14px;border-radius:3px;display:inline-block}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
  .map-wrap{width:100%;overflow:auto;background:#101821;border-radius:12px}
  .map-wrap img,.map-wrap object{width:100%;height:auto;display:block}
  .note,.source{margin-top:14px;color:var(--muted);font-size:.82rem;line-height:1.7}
  .source{border-top:1px solid var(--line);padding-top:12px}
  .source strong{color:#c5d0e0;font-weight:600}
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .gcard{background:#152033;border:1px solid var(--line);border-radius:12px;padding:14px}
  .gcard h3{margin:0 0 8px;font-size:.95rem}
  .gcard p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.6}
  footer{margin-top:24px;color:var(--muted);font-size:.78rem}
  @media(max-width:720px){.groups{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>省级经济因素聚类结果</h1>
    <span class="badge">平台调整 · 聚类地图</span>
  <nav class="nav">
    <a href="index.html">口粮·饲料粮合计占比</a>
    <a href="cluster.html" class="active">省级经济聚类地图</a>
    <a href="platform.html">新平台与总消费量</a>
    <a href="images.html">图片整理</a>
  </nav>
  </header>

  <div class="legend">
    <span><i class="swatch" style="background:#2aa198"></i>第 1 类（5 省）：上海、北京、广东、江苏、浙江</span>
    <span><i class="swatch" style="background:#cb4b16"></i>第 2 类（26 省）：其余有数据省份</span>
    <span><i class="swatch" style="background:#888"></i>无本次聚类数据（台港澳等）</span>
  </div>

  <div class="panel">
    <div class="map-wrap">
      <img src="assets/cluster-map.svg" alt="省级经济聚类着色中国地图：第1类青绿色，第2类橙红色" />
    </div>
    <div class="groups">
      <div class="gcard">
        <h3 style="color:var(--c1)">第 1 类 · 5 省</h3>
        <p>上海、北京、广东、江苏、浙江。</p>
      </div>
      <div class="gcard">
        <h3 style="color:var(--c2)">第 2 类 · 26 省</h3>
        <p>云南、内蒙古、吉林、四川、天津、宁夏、安徽、山东、山西、广西、新疆、江西、河北、河南、海南、湖北、湖南、甘肃、福建、西藏、贵州、辽宁、重庆、陕西、青海、黑龙江。</p>
      </div>
    </div>
  </div>
  <footer>生成于 2026-09-30 · 博士进展汇报前端展示</footer>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据库系统建设</title>
<link rel="stylesheet" href="assets/shared.css" />
</head>
<body>
<div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">粮</span>
          <div>
            <h1>全国粮食需求</h1>
            <p>进展汇报</p>
          </div>
        </div>
        <nav class="side-nav" aria-label="页面导航">
          <a href="index.html">
            <span class="nav-index">01</span>
            <span class="nav-icon">比</span>
            <span class="nav-copy"><strong>口粮·饲料粮占比</strong><small>三法合计占比</small></span>
          </a>
          <a href="cluster.html">
            <span class="nav-index">02</span>
            <span class="nav-icon">图</span>
            <span class="nav-copy"><strong>省级经济聚类</strong><small>着色地图结果</small></span>
          </a>
          <a href="platform.html">
            <span class="nav-index">03</span>
            <span class="nav-icon">平</span>
            <span class="nav-copy"><strong>新平台与总量</strong><small>双平台与总消费</small></span>
          </a>
          <a href="images.html">
            <span class="nav-index">04</span>
            <span class="nav-icon">影</span>
            <span class="nav-copy"><strong>图片整理</strong><small>彩图与灰度对照</small></span>
          </a>
          <a href="database.html" class="active" aria-current="page">
            <span class="nav-index">05</span>
            <span class="nav-icon">库</span>
            <span class="nav-copy"><strong>数据库系统</strong><small>登录与用户管理</small></span>
          </a>
        </nav>
        <button class="theme-toggle" type="button" id="themeToggle" aria-label="切换主题">
          <span id="themeIcon">☾</span>
          <span id="themeLabel">深色模式</span>
        </button>
      </aside>
  <main class="content">
    <header class="page-header">
      <div>
        <p class="eyebrow">数据库系统 · 建设进展</p>
        <h2>数据库系统建设</h2>
        <p class="sub">粮食需求与产能耦合治理研究室 · 用户登录与用户管理后台界面</p>
      </div>
    </header>

    <div class="panel">
      <h2>用户登录</h2>
      <p class="note" style="margin-top:0">系统入口：用户名 / 密码登录，支持记住密码。</p>
      <figure>
        <img src="assets/db/login.png" alt="用户登录界面截图" />
        <figcaption>用户登录页</figcaption>
      </figure>
    </div>

    <div class="panel">
      <h2>用户管理</h2>
      <p class="note" style="margin-top:0">后台可新增用户、设置角色（USER / ADMIN）、有效期与启用状态，并支持禁用与删除。</p>
      <figure>
        <img src="assets/db/user-manage.png" alt="用户管理后台截图" />
        <figcaption>用户管理后台</figcaption>
      </figure>
    </div>

    <footer>生成于 2026-09-30 · 博士进展汇报前端展示</footer>
  </main>
</div>

<script>
(function () {
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  const KEY = 'grain-report-theme';
  function apply(theme) {
    root.dataset.theme = theme;
    const dark = theme === 'dark';
    if (icon) icon.textContent = dark ? '☀' : '☾';
    if (label) label.textContent = dark ? '浅色模式' : '深色模式';
    try { localStorage.setItem(KEY, theme); } catch (e) {}
  }
  let theme = 'light';
  try { theme = localStorage.getItem(KEY) || 'light'; } catch (e) {}
  apply(theme);
  if (btn) btn.addEventListener('click', function () {
    apply(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据库系统建设</title>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#8b9bb4; --line:#2a3548; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#1c2a3f 0%,var(--bg) 55%);color:var(--text);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 64px}
  h1{margin:0 0 8px;font-size:1.55rem;font-weight:650}
  .sub{color:var(--muted);line-height:1.65;font-size:.95rem;margin:0}
  .badge{display:inline-block;margin-top:14px;padding:4px 10px;border-radius:999px;background:#243247;color:#9ec5e8;font-size:.8rem}
  .nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
  .nav a{text-decoration:none;color:#8b9bb4;background:#243247;padding:7px 12px;border-radius:999px;font-size:.85rem;border:1px solid #2a3548}
  .nav a.active,.nav a:hover{color:#9ec5e8;border-color:#5b9fd4}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
  .panel h2{margin:0 0 10px;font-size:1.05rem}
  .note{color:var(--muted);font-size:.85rem;line-height:1.65;margin:0 0 12px}
  figure{margin:0;background:#101821;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  figure img{width:100%;height:auto;display:block}
  figcaption{padding:10px 12px;color:var(--muted);font-size:.82rem;line-height:1.5}
  footer{margin-top:24px;color:var(--muted);font-size:.78rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>数据库系统建设</h1>
    <p class="sub">粮食需求与产能耦合治理研究室 · 用户登录与用户管理后台界面</p>
    <span class="badge">数据库系统 · 建设进展</span>
    <nav class="nav">
      <a href="index.html">口粮·饲料粮合计占比</a>
      <a href="cluster.html">省级经济聚类地图</a>
      <a href="platform.html">新平台与总消费量</a>
      <a href="images.html">图片整理</a>
      <a href="database.html" class="active">数据库系统建设</a>
    </nav>
  </header>

  <div class="panel">
    <h2>用户登录</h2>
    <p class="note">系统入口：用户名 / 密码登录，支持记住密码。</p>
    <figure>
      <img src="assets/db/login.png" alt="用户登录界面截图" />
      <figcaption>用户登录页</figcaption>
    </figure>
  </div>

  <div class="panel">
    <h2>用户管理</h2>
    <p class="note">后台可新增用户、设置角色（USER / ADMIN）、有效期与启用状态，并支持禁用与删除。</p>
    <figure>
      <img src="assets/db/user-manage.png" alt="用户管理后台截图" />
      <figcaption>用户管理后台</figcaption>
    </figure>
  </div>

  <footer>生成于 2026-09-30 · 博士进展汇报前端展示</footer>
</div>
</body>
</html>
